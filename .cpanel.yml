---
# cPanel Deployment Configuration
# This file tells cPanel what to do after pulling from Git
# BRANCH: test_host (for testing deployment)

deployment:
  tasks:
    # Install/update dependencies
    - export DEPLOYPATH=/home/YOUR_CPANEL_USERNAME/YOUR_APP_FOLDER
    - /bin/cp -r * $DEPLOYPATH
    - cd $DEPLOYPATH
    - npm install --production
    
    # Run database migrations
    - npm run migrate:run
    
    # Restart the Node.js application
    - /usr/bin/pkill -f "node.*index.js" || true
    - sleep 2
    - cd $DEPLOYPATH && NODE_ENV=production nohup node index.js > app.log 2>&1 &
    
    # Or if using PM2 (recommended)
    # - pm2 restart all || pm2 start index.js --name "dsscreen-backend"
